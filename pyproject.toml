[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lsgen"
version = "0.1.0"
description = "Benchmark for subclass-preserving image generation (Stanford Cars)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas",
  "pyarrow",
  "scipy",
  "pillow",
  "pyyaml",
  "matplotlib",
  "scikit-learn",
  "torch",
  "dreamsim==0.2.1",   # DreamSim embeddings (pulls peft, open-clip-torch)
  "torchvision",
  "timm",
  "ImageHash==4.3.2",
  "tabulate==0.9.0",
  "igraph==0.11.8",    # Leiden clustering (lsgen/eval/clustering.py)
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["lsgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
