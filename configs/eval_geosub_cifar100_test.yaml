# CIFAR-100: geosub's own prototype clusters on test (configs/geosub_cifar100.yaml), against k-means on frozen DINOv3-L of the same images. Run:
#   CONFIG=configs/eval_geosub_cifar100_test.yaml sbatch slurm/eval_geosub.sh
data_config: configs/data_cifar100.yaml
labels: cifar100
report_dir: repr
split: test
runs: [geosub_geo_sub_large_p50_s0, geosub_geo_sub_large_p50_s1, geosub_geo_sub_large_p50_s2, geosub_geo_sub_large_p50_s3, geosub_geo_sub_large_p50_s4]   # reported, never used to choose
reference: dinov3_large_32     # k-means (R2 pipeline, oracle K and K-hat) on the frozen embedding of the same images: the like-for-like baseline
subsample: 0.632
n_boot: 1000
n_jobs: 12          # = --cpus-per-task in slurm/eval_geosub.sh
seed: 0
