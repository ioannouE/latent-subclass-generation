# Final report on test of the run chosen on val (geo_sub, configs/eval_geosub_maskcon.yaml), with the frozen k-means reference on the same
# test images. Scored once; nothing is chosen from it. Run: CONFIG=configs/eval_geosub_maskcon_test.yaml sbatch slurm/eval_geosub.sh
data_config: configs/data.yaml
labels: maskcon_new
report_dir: repr_maskcon_new
split: test
runs: [geosub_geo_sub_bodytype_new_s0]   # the val choice only: test is scored once
reference: dinov3_base_256    # k-means (R2 pipeline, oracle K and K-hat) on the frozen embedding of the same images: the like-for-like baseline
subsample: 0.632              # CIs of the reference K-hat table, as configs/eval_representation.yaml
n_boot: 1000
n_jobs: 12          # = --cpus-per-task in slurm/eval_geosub.sh
seed: 0
