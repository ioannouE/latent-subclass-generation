# Stanford Cars (make scheme): R1-R5 (k-means, oracle K and K-hat) on test for frozen DINOv3-L and the ksub runs (configs/ksub_cars.yaml, after slurm/train_ksub.sh).
# Same settings as configs/eval_representation.yaml. Then scripts/summarize_ksub.py. Run: CONFIG=configs/eval_repr_ksub_cars.yaml sbatch slurm/eval_representation.sh
data_config: configs/data.yaml
labels: make
report_dir: ksub                 # = report_dir in configs/ksub_cars.yaml
encoders: [dinov3_large, ksub_coarse_large_s0, ksub_coarse_large_s1, ksub_coarse_large_s2, ksub_sub_large_s0, ksub_sub_large_s1, ksub_sub_large_s2,
           ksub_full_large_s0, ksub_full_large_s1, ksub_full_large_s2]   # frozen = dinov3_large itself (z = f)
crop_sizes: [256]
knn_k: 20
n_boot: 1000
subsample: 0.632
tables: [r1, r2_within_make, r2_oracle, r2_khat, r3, r4, r5]
n_jobs: 16            # = --cpus-per-task in slurm/eval_representation.sh
seed: 0
