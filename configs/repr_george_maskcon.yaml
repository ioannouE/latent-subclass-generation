# GEORGE on the MaskCon label scheme (coarse = 8 body types, data/maskcon_coarse.csv), otherwise identical to configs/repr_george.yaml.
# max_k 52 = the largest K_c under this scheme (Sedan: 50 classes) plus the same margin of 2 as in the make scheme (22 + 2).
# GEORGE (Sohoni et al. 2020, third_party/hidden-stratification) with the recipe of configs/repr_baselines.yaml: same backbone, crop, last 4 blocks,
# optimiser, epochs, batch size and augmentation; make labels only. Run: CONFIG=configs/repr_george_maskcon.yaml sbatch slurm/train_george.sh
# Evaluation embedding (declared before any run): backbone CLS of the group-DRO model -> encoder george<tag>_s<seed>; the stage-1 ERM model is
# also exported as george_erm_s<seed> (what GEORGE starts from: make cross-entropy only).
data_config: configs/data.yaml
labels: maskcon                 # lsgen/data/labels.py; delete `labels` and `tag` (or use configs/repr_george.yaml) for the default make scheme
tag: _bodytype                  # runs george_bodytype_s<seed>, george_erm_bodytype_s<seed>: the make-trained features are not overwritten
backbone: dinov3_base
crop: bbox15_256
george:
  umap_components: 2            # UMAP(n_neighbors 10, min_dist 0) per make on the ERM activations (GEORGE defaults)
  max_k: 52                     # upper end of the silhouette search over GMM components (same margin as n_proto in configs/repr_nhp.yaml)
  robust_lr: 0.01               # group-DRO step size
  size_adjustment: 2            # group-DRO generalisation adjustment, C / sqrt(group size)
seeds: [0]
trainable_blocks: 4
epochs: 50                      # per stage
batch_size: 256
lr_backbone: 2.0e-5
lr_head: 1.0e-3
weight_decay: 0.05
warmup_epochs: 3
aug: {scale_min: 0.4, color_jitter: 0.4, jitter_p: 0.8, grayscale_p: 0.2}
eval_every: 10                  # val make kNN@20 (monitoring only: no model selection, last epoch is used)
num_workers: 8
batch_size_embed: 128
