# DINOv3-L runs (configs/geosub_maskcon_large{,_p50,_kmeans,_weights}.yaml), otherwise identical to configs/eval_geosub_maskcon.yaml. Run:
#   CONFIG=configs/eval_geosub_maskcon_large.yaml sbatch slurm/eval_geosub.sh
data_config: configs/data.yaml
labels: maskcon_new
report_dir: repr_maskcon_new
split: val
runs: [geosub_geo_sub_km50_g05_s05_v05_bodytype_new_large_s0, geosub_geo_sub_km50_g05_s05_v05_bodytype_new_large_s1, geosub_geo_sub_km50_g05_s05_v05_bodytype_new_large_s2, geosub_geo_sub_km50_g05_s05_v05_bodytype_new_large_s3, geosub_geo_sub_km50_g05_s05_v05_bodytype_new_large_s4, geosub_geo_sub_km50_g05_s0_v1_bodytype_new_large_s0, geosub_geo_sub_km50_g05_s0_v1_bodytype_new_large_s1, geosub_geo_sub_km50_g05_s0_v1_bodytype_new_large_s2, geosub_geo_sub_km50_g05_s0_v1_bodytype_new_large_s3, geosub_geo_sub_km50_g05_s0_v1_bodytype_new_large_s4, geosub_geo_sub_km50_g05_s05_v1_bodytype_new_large_s0, geosub_geo_sub_km50_g05_s05_v1_bodytype_new_large_s1, geosub_geo_sub_km50_g05_s05_v1_bodytype_new_large_s2, geosub_geo_sub_km50_g05_s05_v1_bodytype_new_large_s3, geosub_geo_sub_km50_g05_s05_v1_bodytype_new_large_s4]   # loss-weight variants (configs/geosub_*_weights.yaml); test: reported, never used to choose
# done: geosub_geo_sub_km50_bodytype_new_large_s0-4, geosub_geo_sub_km50_g01_bodytype_new_large_s0-4, geosub_geo_sub_km50_g01_v1_bodytype_new_large_s0-4, geosub_geo_sub_km50_g03_bodytype_new_large_s0-4, geosub_geo_sub_km50_g0_v1_bodytype_new_large_s0-4, geosub_geo_sub_km50_s01_bodytype_new_large_s0-4, geosub_geo_sub_km50_s03_bodytype_new_large_s0-4, geosub_geo_sub_km50_v03_bodytype_new_large_s0-4, geosub_geo_sub_km50_v1_bodytype_new_large_s0-4, geosub_geo_sub_km50_v3_bodytype_new_large_s0-4
# done (reports/repr_maskcon_new): geosub_geo_sub_bodytype_new_large_p50_s0-4, geosub_{geo_sub_km50_u03,geo_sub_km50_u1,geo_sub_K}_bodytype_new_large_s0-4 (prototype fixes);
#   geosub_{geo,geo_sub}_bodytype_new_large_s0 (n_proto 52)
reference: dinov3_large_256    # k-means (R2 pipeline, oracle K and K-hat) on the frozen embedding of the same images: the like-for-like baseline
subsample: 0.632              # CIs of the reference K-hat table, as configs/eval_representation.yaml
n_boot: 1000
n_jobs: 12          # = --cpus-per-task in slurm/eval_geosub.sh
seed: 0
