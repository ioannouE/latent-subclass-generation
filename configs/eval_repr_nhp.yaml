# R1-R5 for NHP (names = <method>_s<seed>[_cat], crop = the training crop size). Same protocol and settings as configs/eval_representation.yaml.
data_config: configs/data.yaml
encoders: [nhp_s0, nhp_s0_cat]
crop_sizes: [256]
knn_k: 20
n_boot: 1000
subsample: 0.632          # K-hat and R4 CIs, see configs/eval_representation.yaml
tables: [r1, r2_within_make, r2_oracle, r2_khat, r3, r4, r5]
n_jobs: 16
seed: 0
