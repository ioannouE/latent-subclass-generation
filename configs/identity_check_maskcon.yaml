# Identity-score pre-check on the MaskCon label scheme (coarse = 8 body types, hidden subclass = 196 classes, data/maskcon_coarse.csv), otherwise
# identical to configs/identity_check.yaml: scores and the decision rule are computed within each body type instead of each make.
data_config: configs/data.yaml
labels: maskcon                # lsgen/data/labels.py
report_dir: identity_check_maskcon
split: train
crop_size: 256
dino: dinov3_base
dreamsim: dreamsim_ensemble
gate_k: 20
top_n: 5
n_boot: 200                    # body types have up to 1,849 train images (1.7M pairs), 1000 draws would take hours; 200 suffice for the CI
subsample: 0.632
n_jobs: 8                      # = --cpus-per-task in slurm/identity_check.sh
seed: 0
decision:                      # same rule as configs/identity_check.yaml, fixed before the run
  min_gain: 0.02
