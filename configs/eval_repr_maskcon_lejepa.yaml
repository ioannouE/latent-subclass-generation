# MaskCon label scheme: R1-R5 for LeJEPA. It uses no labels, so the default-scheme features (lejepa_s0_256) are reused; only the evaluation labels change.
data_config: configs/data.yaml
labels: maskcon
report_dir: repr_maskcon
encoders: [lejepa_s0]
crop_sizes: [256]
knn_k: 20
n_boot: 1000
subsample: 0.632
tables: [r1, r2_within_make, r2_oracle, r2_khat, r3, r4, r5]
n_jobs: 16
seed: 0
