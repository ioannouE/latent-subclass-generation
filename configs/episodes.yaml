# Milestone 2: use-case-B episodes (frozen before any method runs).
data_config: configs/data.yaml   # raw/derived/data roots come from here
seed: 0
out_dir: data/episodes           # relative to repo, committed

single:
  ks: [1, 5, 10]
  n_episodes: 5          # per eligible fine class and k
  min_target: 10         # eligible if >= k + min_target test images (after exclusions)
  support_sources: [test, train]   # "train": S from the train split (not val), T = all test images of the class

mixed:
  k: 10
  ratios: [0.2, 0.5, 0.8]          # share of subclass a in S
  n_episodes: 5                    # per (pair, ratio)
  min_target: 10                   # per subclass, after removing its support
  max_pairs_per_make: 10           # all pairs if fewer; else a seeded sample

max_redraws: 100                   # redraw S to avoid near-duplicate pairs between S and T
