# Analysis of the cached embeddings (reference = train, queries = test; descriptive only, no tuning).
data_config: configs/data.yaml
encoders: [dinov3_base, dinov3_large, clip_l, sscd]
crop_sizes: [128, 256]
knn_k: 20
projection_encoders: [dinov3_large_256, dinov3_base_128, clip_l_128, sscd_128]   # UMAP / t-SNE of all test images
top_makes: 8                     # makes coloured in the global projections (largest first), others grey
within_make_encoders: [dinov3_large_256, clip_l_128]
within_makes: [Chevrolet, Audi, Hyundai]   # projections coloured by fine class
umap_neighbors: 15
tsne_perplexity: 30
n_jobs: 16                       # = --cpus-per-task in slurm/analyze_features.sh
seed: 0
