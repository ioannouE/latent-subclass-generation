# G-0b (docs/EXPERIMENT_GENERATION.md): CIFAR-100 generation metrics (coarse = 20 superclasses, subclass = 100 classes; generated images are 32 px).
# Copy of configs/eval_generation.yaml with data_config / labels / crop changed. Output: reports/cifar100/generation/.
data_config: configs/data_cifar100.yaml
labels: cifar100             # label scheme (configs/labels.yaml): its evaluators, episodes and exclusion list; output <reports_root>/generation[_<labels>]/
validation_config: configs/metric_validation.yaml   # its `headline` metrics are written to headline.csv
use_case: A                  # A | B
samples_dir: outputs/samples/example
crop: native
crop_size: 32                # reference embeddings are the cached crops of this size
tau_target: 0.9              # G4: tau = smallest confidence at which the calibrated fine classifier has this val accuracy
min_samples: 5               # G4: samples needed to call a fine class covered
copy_threshold: 0.5          # G7
prdc_k: 5                    # G1 neighbourhood size
coverage_k: 3                # G4/G5/B2 neighbourhood size (small sets)
n_episodes_images: 16        # B: expected generated images per episode
subsample: 0.632              # G4/G5 CIs of KID: draws without replacement of this fraction of a make (resampling duplicates biases it)
n_boot: 1000
n_jobs: 16                   # = --cpus-per-task in slurm/eval_generation.sh
batch_size: 128
num_workers: 8
seed: 0
