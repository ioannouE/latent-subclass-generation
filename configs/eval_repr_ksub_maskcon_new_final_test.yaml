# R1-R5 on test for the final Stanford Cars ksub configuration (configs/ksub_maskcon_new_final.yaml); frozen = dinov3_large. Scored once, after
# every choice was made on val; the encoders are the val winner of configs/ksub_maskcon_new_coarse.yaml (tau0025 = lambda_coarse 0.10).
# Run: CONFIG=configs/eval_repr_ksub_maskcon_new_final_test.yaml sbatch slurm/eval_representation.sh
data_config: configs/data.yaml
labels: maskcon_new
report_dir: ksub_maskcon_new_final  # = report_dir in configs/ksub_maskcon_new_final.yaml
encoders: [dinov3_large,
           ksub_tau0025_bodytype_new_large_refresh_s0, ksub_tau0025_bodytype_new_large_refresh_s1, ksub_tau0025_bodytype_new_large_refresh_s2]
crop_sizes: [256]
knn_k: 20
n_boot: 1000
subsample: 0.632
tables: [r1, r2_within_make, r2_oracle, r2_khat, r3, r4, r5]
n_jobs: 16            # = --cpus-per-task in slurm/eval_representation.sh
seed: 0
