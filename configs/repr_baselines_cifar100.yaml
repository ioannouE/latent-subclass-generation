# CIFAR-100 (docs/DATA_CIFAR100.md): Step 2 baselines with the controlled recipe, coarse = 20 superclasses only (LeJEPA: no labels).
# Copy of configs/repr_baselines_maskcon_new.yaml with only data_config / labels / crop / FALCON's num_fine changed; no tag needed
# (outputs go to the CIFAR-100 derived_root). NHP is left out: its nuisance views need object bounding boxes.
data_config: configs/data_cifar100.yaml
labels: cifar100               # configs/labels.yaml
backbone: dinov3_base          # key of lsgen.features.encoders.ENCODERS
crop: native_32                # the native 32 px images; the augmentation outputs the backbone's input size
methods:
  supcon: {kind: contrastive, supcon: 1.0, simclr: 0.0}       # weights of SupCon on make labels and SimCLR on image identity
  simclr: {kind: contrastive, supcon: 0.0, simclr: 1.0}
  supcon_simclr: {kind: contrastive, supcon: 1.0, simclr: 1.0}
  lejepa: {kind: lejepa, lam: 0.05, num_slices: 1024, num_points: 17}   # label-free; as in configs/repr_baselines.yaml, trained on the CIFAR-100 train split
  maskcon: {kind: maskcon, queue: 4096, momentum: 0.99, t: 0.1, t0: 0.1, w: 1.0}   # as on Stanford Cars (same recipe for every dataset)
  falcon:                       # uses K: num_fine = number of hidden subclasses (the 100 classes), the one thing FALCON needs besides the make labels
    kind: falcon
    num_fine: 100
    neighbor_pool: 20           # same-superclass nearest neighbours in the frozen backbone features, 5 of them drawn per step (n_neighbors)
    n_neighbors: 5
    lambdas: [0.5, 0.5, 2.0]    # coarse CE, fine CE + consistency, entropy regulariser
    temperature: 0.9
    beta_reg: 0.1               # size penalty of the fine -> coarse assignment M (first half of training only)
    solve_every: 20             # steps between re-estimates of M
    soft_epochs: 25             # soft pseudo-labels (tau 1 -> 0) for this many epochs, then hard
    ema_decay: 0.99
seeds: [0]
trainable_blocks: 4            # last N transformer blocks (+ final norm) are fine-tuned, the rest stays frozen
head: [2048, 128]              # projection head hidden / output dims (dropped after training)
temperature: 0.1
epochs: 50
batch_size: 256                # images per step (2 views each); lower it if the GPU runs out of memory
lr_backbone: 2.0e-5
lr_head: 1.0e-3
weight_decay: 0.05
warmup_epochs: 3
aug: {scale_min: 0.4, color_jitter: 0.4, jitter_p: 0.8, grayscale_p: 0.2}   # + random resized crop and horizontal flip
eval_every: 10                 # log val kNN@20 make accuracy (monitoring only: no model selection, last epoch is used)
num_workers: 8                 # = --cpus-per-task in slurm/train_repr.sh
batch_size_embed: 128
