# Frozen DINOv3-B clusters for the cluster rungs of the generation ladder (docs/EXPERIMENT_GENERATION.md): k-means only, no training,
# true K_c per class ("uses K"), one clustering per seed; the DINOv3-L clusters are the existing frozen runs of configs/ksub_maskcon_new*.yaml.
# Run: CONFIG=configs/ksub_maskcon_new_base_frozen.yaml sbatch slurm/train_ksub.sh
# Output: <derived_root>/ksub_clusters/ksub_frozen_bodytype_new_base_s<seed>.csv
data_config: configs/data.yaml
labels: maskcon_new
tag: _bodytype_new_base
backbone: dinov3_base          # frozen; features cached by slurm/extract_features.sh
crop: bbox15_256
methods:
  frozen: {}                   # k-means on f (z = f)
seeds: [0, 1, 2]
hidden: 2048                   # unused without training (head built, not trained)
k: oracle
k_max: 60                      # as the DINOv3-L K-hat runs
