# Make scheme: R1-R5 on test for geosub's z (configs/geosub_make.yaml, after slurm/train_geosub.sh); frozen DINOv3-L is in reports/repr/dinov3_large_256.
# Run: CONFIG=configs/eval_repr_make_geosub.yaml sbatch slurm/eval_representation.sh
data_config: configs/data.yaml
labels: make
report_dir: repr
encoders: [geosub_geo_sub_km50_make_large_s0, geosub_geo_sub_km50_make_large_s1, geosub_geo_sub_km50_make_large_s2, geosub_geo_sub_km50_make_large_s3, geosub_geo_sub_km50_make_large_s4,
           geosub_geo_sub_K_make_large_s0, geosub_geo_sub_K_make_large_s1, geosub_geo_sub_K_make_large_s2, geosub_geo_sub_K_make_large_s3, geosub_geo_sub_K_make_large_s4]
crop_sizes: [256]
knn_k: 20
n_boot: 1000
subsample: 0.632
tables: [r1, r2_within_make, r2_oracle, r2_khat, r3, r4, r5]
n_jobs: 16            # = --cpus-per-task in slurm/eval_representation.sh
seed: 0
