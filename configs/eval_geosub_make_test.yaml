# geosub own prototype clusters on the make scheme (test; configs/geosub_make.yaml), against k-means on frozen DINOv3-L. Run:
#   CONFIG=configs/eval_geosub_make_test.yaml sbatch slurm/eval_geosub.sh
data_config: configs/data.yaml
labels: make
report_dir: repr
split: test
runs: [geosub_geo_sub_km50_make_large_s0, geosub_geo_sub_km50_make_large_s1, geosub_geo_sub_km50_make_large_s2, geosub_geo_sub_km50_make_large_s3, geosub_geo_sub_km50_make_large_s4,
       geosub_geo_sub_K_make_large_s0, geosub_geo_sub_K_make_large_s1, geosub_geo_sub_K_make_large_s2, geosub_geo_sub_K_make_large_s3, geosub_geo_sub_K_make_large_s4]
reference: dinov3_large_256    # k-means (R2 pipeline, oracle K and K-hat) on the frozen embedding of the same images: the like-for-like baseline
subsample: 0.632
n_boot: 1000
n_jobs: 12          # = --cpus-per-task in slurm/eval_geosub.sh
seed: 0
