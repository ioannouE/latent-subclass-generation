# Milestone 4: representation metrics R1-R5 on cached embeddings (fit/reference = train, scored on test).
data_config: configs/data.yaml
encoders: [dinov3_base, dinov3_large, clip_l, sscd]
crop_sizes: [128, 256]
knn_k: 20
n_boot: 1000          # bootstrap resamples of images within each make
khat_subsample: 0.632  # K-hat metrics: CIs from draws without replacement of this fraction of a make
n_jobs: 16            # = --cpus-per-task in slurm/eval_representation.sh
seed: 0
