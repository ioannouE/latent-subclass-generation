# Milestone 5: build the control sets (CPU). Output: <derived_root>/controls[_<labels>]/<control>_<A|B>/ with PNGs (symlinks to the
# stored crops where unmodified), samples.csv and method.json, in the format scripts/eval_generation.py reads.
data_config: configs/data.yaml
labels: make                   # label scheme (configs/labels.yaml); output <derived_root>/controls[_<labels>]/, episodes from <data_root>/episodes[_<labels>]/
crop: bbox15
crop_size: 128
features: dinov3_base          # embeddings for the C4 medoids and C1b retrieve-NN (cached by scripts/extract_features.py)
episode_sets: [single_test_k1, single_test_k5, single_test_k10, mixed_k10]   # use case B (support and target from test)
n_episodes_images: 16          # images per episode, as in configs/eval_generation.yaml
seed: 0
