# CIFAR-100 (coarse = 20 superclasses, hidden subclass = 100 classes, K_c = 5 everywhere): R1-R5 for the frozen encoders.
# Copy of configs/eval_representation.yaml with only data_config / labels / crop_sizes changed. No K_c = 1 superclass: R5's K-hat error is empty.
data_config: configs/data_cifar100.yaml
labels: cifar100
report_dir: repr                 # under reports_root = reports/cifar100
encoders: [dinov3_base, dinov3_large, clip_l, sscd]
crop_sizes: [32]
knn_k: 20
n_boot: 1000          # bootstrap resamples of images within each superclass
subsample: 0.632      # K-hat (r2_khat) and R4 CIs, see configs/eval_representation.yaml
tables: [r1, r2_within_make, r2_oracle, r2_khat, r3, r4, r5]
n_jobs: 16            # = --cpus-per-task in slurm/eval_representation.sh
seed: 0
