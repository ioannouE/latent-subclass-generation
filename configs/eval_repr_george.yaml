# R1-R5 for GEORGE (names = george_s<seed>, george_erm_s<seed>; crop = the training crop size). Same protocol as configs/eval_representation.yaml.
data_config: configs/data.yaml
encoders: [george_s0, george_erm_s0]
crop_sizes: [256]
knn_k: 20
n_boot: 1000
subsample: 0.632          # K-hat and R4 CIs, see configs/eval_representation.yaml
tables: [r1, r2_within_make, r2_oracle, r2_khat, r3, r4, r5]
n_jobs: 16
seed: 0
