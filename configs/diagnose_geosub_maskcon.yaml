# Does geosub's training learn beyond its initialisation? Stanford Cars maskcon_new, frozen DINOv3-L runs (configs/geosub_maskcon_large_{p50,kmeans,weights}.yaml).
# Train and val only (diagnostic, not used to choose). Run: sbatch slurm/diagnose_geosub.sh
data_config: configs/data.yaml
labels: maskcon_new
report_dir: repr_maskcon_new
backbone: dinov3_large_256     # frozen features the runs were trained on
runs:                          # name: run prefix (geosub_<method><tag>); init, n_proto, min_count and known_k are read from each run's manifest
  random_p50: geosub_geo_sub_bodytype_new_large_p50
  K: geosub_geo_sub_K_bodytype_new_large
  km50: geosub_geo_sub_km50_bodytype_new_large
  km50_g03: geosub_geo_sub_km50_g03_bodytype_new_large
  km50_g01: geosub_geo_sub_km50_g01_bodytype_new_large
  km50_g01_v1: geosub_geo_sub_km50_g01_v1_bodytype_new_large
  km50_g0_v1: geosub_geo_sub_km50_g0_v1_bodytype_new_large
  km50_s03: geosub_geo_sub_km50_s03_bodytype_new_large
  km50_s01: geosub_geo_sub_km50_s01_bodytype_new_large
  km50_v03: geosub_geo_sub_km50_v03_bodytype_new_large
  km50_v1: geosub_geo_sub_km50_v1_bodytype_new_large
  km50_v3: geosub_geo_sub_km50_v3_bodytype_new_large
  km50_u03: geosub_geo_sub_km50_u03_bodytype_new_large
  km50_u1: geosub_geo_sub_km50_u1_bodytype_new_large
seeds: [0, 1, 2, 3, 4]
knn_k: 10
tsne: {km50: [Sedan, Cab], km50_g0_v1: [Sedan]}   # coarse classes plotted, first seed, train
n_jobs: 8           # = --cpus-per-task in slurm/diagnose_geosub.sh
