# G-0b (docs/EXPERIMENT_GENERATION.md): use-case-B episodes for the maskcon_new scheme (196 official classes in 8 body types; mixed pairs are two
# classes of one body type). Copy of configs/episodes.yaml with only `labels` changed. Output: data/episodes_maskcon_new/.
data_config: configs/data.yaml
seed: 0
labels: maskcon_new                 # label scheme (configs/labels.yaml); output <data_root>/episodes[_<labels>]/, committed
near_dup_files: [duplicates.csv, duplicates_within_test.csv]   # in data_root: known near-duplicate pairs (first two columns), kept out of S x T

single:
  ks: [1, 5, 10]
  n_episodes: 5          # per eligible fine class and k
  min_target: 10         # eligible if >= k + min_target test images (after exclusions)
  support_sources: [test, train]   # "train": S from the train split (not val), T = all test images of the class

mixed:
  k: 10
  ratios: [0.2, 0.5, 0.8]          # share of subclass a in S
  n_episodes: 5                    # per (pair, ratio)
  min_target: 10                   # per subclass, after removing its support
  max_pairs_per_make: 10           # all pairs if fewer; else a seeded sample

max_redraws: 100                   # redraw S to avoid near-duplicate pairs between S and T
