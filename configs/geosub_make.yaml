# geosub on the make scheme (coarse = 49 makes, hidden subclass = 189 make-models), frozen DINOv3-L: the two maskcon_new choices carried over
# unchanged (docs/EXPERIMENT_GEOSUB.md): km50 (label-free val choice) and geosub-K (uses K). Nothing chosen on this scheme; test scored once.
# 19 makes have fewer than 50 train images: their prototype count is capped at the class size (scripts/train_geosub.py).
#   CONFIG=configs/geosub_make.yaml sbatch slurm/train_geosub.sh
data_config: configs/data.yaml
labels: make                   # configs/labels.yaml: also picks the exclusion list
tag: _make_large               # run names geosub_<method>_make_large_s<seed>
cache_tag: _make               # own views / mirror cache: the make exclusion list keeps 39 train images that maskcon_new drops
backbone: dinov3_large         # frozen; clean features cached (slurm/extract_features.sh); views / mirror images cached on the first run
crop: bbox15_256
methods:
  geo_sub_km50: {geo: 1.0, sub: 1.0}                      # k-means init, usage 0.1: label-free
  geo_sub_K: {geo: 1.0, sub: 1.0, known_k: true}          # geosub-K (uses K): K_c k-means prototypes per class, all active
seeds: [0, 1, 2, 3, 4]
views: 8                       # cached random augmentations per train image; two different ones per image and step
aug: {scale_min: 0.4, color_jitter: 0.4, jitter_p: 0.8, grayscale_p: 0.2}   # as configs/geosub_maskcon_large_kmeans.yaml (+ crop and flip)
hidden: 2048                   # width of g
proto_init: kmeans             # prototypes start at k-means centroids (n_init 10, run seed) of each class's frozen train features
n_proto: 50                    # prototypes per coarse class: fixed, the same on every dataset (does not use K_c)
min_count: 10                  # a prototype is active (counts towards K-hat) if it is the nearest of >= 10 train images; fixed before any run
tau_geo: 0.1                   # L_geo softmax temperature
tau_student: 0.1               # L_sub assignment temperatures (sharpened targets, as configs/repr_nhp_maskcon.yaml)
tau_teacher: 0.04
usage: 0.1                     # weak anti-collapse inside L_sub: entropy of each class's mean assignment (no equipartition)
temperature: 0.1               # L_supcon
epochs: 100
batch_size: 512
lr: 1.0e-3
weight_decay: 0.05
warmup_epochs: 5
eval_every: 20                 # val kNN@20 coarse accuracy (monitoring only: no model selection, last epoch is used)
num_workers: 8                 # = --cpus-per-task in slurm/train_geosub.sh (feature caching)
batch_size_embed: 128
