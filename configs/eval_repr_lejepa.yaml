# R1-R5 for LeJEPA (label-free SSL, name = lejepa_s<seed>). Same protocol as configs/eval_representation.yaml.
data_config: configs/data.yaml
encoders: [lejepa_s0]
crop_sizes: [256]
knn_k: 20
n_boot: 1000
subsample: 0.632          # K-hat and R4 CIs, see configs/eval_representation.yaml
tables: [r1, r2_within_make, r2_oracle, r2_khat, r3, r4, r5]   # what to (re)compute; the others are kept
n_jobs: 16
seed: 0
